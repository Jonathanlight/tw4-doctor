name: Release

# Publishes to npm through Trusted Publishing (OIDC). There is no NPM_TOKEN:
# the job authenticates as itself using GitHub's OIDC identity, which npm checks
# against the trusted publisher configured on the package.
#
# Why not a token: npm's token routes are being retired. Classic Automation
# tokens were revoked in December 2025, and granular tokens with the 2FA bypass
# were deprecated in July 2026 — they already need an interactive challenge for
# sensitive operations and lose the right to publish around January 2027.
# Building a release pipeline on either would mean rebuilding it within months.
#
# One prerequisite per package, and it cannot be done from here: npm only lets a
# trusted publisher be attached to a package that already exists, so 0.1.0 was
# published by hand. Every release after that runs in this workflow.
#
# Provenance is signed automatically under OIDC, so there is no --provenance
# flag and no publishConfig.provenance — passing either is redundant now.

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # replaces the publish token entirely

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm >= 11.5.1, which is newer than the version
      # bundled with Node 22.
      - name: Use an npm that supports trusted publishing
        run: |
          npm install -g npm@latest
          npm --version

      - run: npm ci --legacy-peer-deps

      - name: Check the tag matches the version in package.json
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $PKG." >&2
            echo "Bump the version and retag; a wrong version cannot be unpublished after 72h." >&2
            exit 1
          fi
          echo "Publishing version $PKG"

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Publish to npm
        if: startsWith(github.ref, 'refs/tags/')
        run: npm publish

      - name: Dry run
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: npm publish --dry-run
